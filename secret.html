<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zugang gewährt</title>
<!-- Schriften -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #f8f5ed;
    color: #333333;

    font-family: 'Montserrat', sans-serif;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

/* Hauptbox */

.box {
    width: 100%;
    max-width: 500px;

    background: #ffffff;

    border: 2px solid #7da291;

    padding: 45px 35px;

    text-align: center;

    border-radius: 4px;

    box-shadow:
        0 10px 35px rgba(125,162,145,0.20);

    animation: reveal 1s ease-out;
}

/* Überschrift */

h1 {
    font-family: 'Cormorant Garamond', serif;

    font-weight: 600;

    color: #7da291;

    font-size: clamp(38px, 10vw, 56px);

    line-height: 1.1;

    margin-bottom: 20px;
}

/* Text */

p {
    font-family: 'Montserrat', sans-serif;

    font-size: clamp(15px, 4vw, 18px);

    line-height: 1.8;

    color: #333333;

    margin-bottom: 10px;
}

/* Button */

button {
    width: 100%;

    margin-top: 25px;

    padding: 15px;

    background: #7da291;

    border: 2px solid #7da291;

    color: #ffffff;

    cursor: pointer;

    font-family: 'Montserrat', sans-serif;

    font-size: 15px;

    font-weight: 600;

    letter-spacing: 1px;

    border-radius: 3px;

    transition: 0.3s;
}

button:hover {
    background: #6f9382;

    border-color: #6f9382;
}

button:active {
    transform: scale(0.98);
}

/* Kleine Reveal-Animation */

@keyframes reveal {

    from {
        opacity: 0;
        transform: translateY(25px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}

/* Mobile */

@media (max-width: 480px) {

    body {
        padding: 15px;
    }

    .box {
        padding: 35px 22px;
    }

}

</style>
</head>
<body>
<div class="box">
<h1>Zugang gewährt</h1>

<p>
    Ihr habt das Rätsel gelöst.
    Zum Enthüllen klickt auf Weiter.
</p>

<button id="nextButton">
    WEITER
</button>
</div>
<script>

document
    .getElementById("nextButton")
    .addEventListener("click", function() {

        window.location.href = "final.html";

    });

</script>
</body>
</html>
