<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OUR NEXT TRIP</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Montserrat", sans-serif;
    background:#f0ece7;
    color:#6f7c70;
    display:flex;
    justify-content:center;
    padding:20px;
}

/* REVEAL */
.container{
    width:100%;
    max-width:700px;
    text-align:center;

    opacity:0;
    transform:translateY(30px) scale(0.98);

    animation:reveal 1.8s ease-out forwards;
}

@keyframes reveal{
    0%{
        opacity:0;
        transform:translateY(30px) scale(0.98);
        filter:blur(8px);
    }
    100%{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
    }
}

/* Titel */
h1{
    font-family:"Cormorant Garamond", serif;
    font-weight:600;
    color:#7da291;
    font-size:clamp(30px, 8vw, 48px);
    margin-bottom:25px;
    line-height:1.15;

    animation:glow 2.5s ease-in-out infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 5px rgba(125,162,145,0.25); }
    to{ text-shadow:0 0 20px rgba(125,162,145,0.65); }
}

    h2{
    color:#6f7c70;
    font-size:clamp(18px, 5vw, 30px);
    margin-bottom:21px;
    line-height:1.3;

    animation:glow 2.5s ease-in-out infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 5px rgba(125,162,145,0.25); }
    to{ text-shadow:0 0 20px rgba(125,162,145,0.65); }
}

/* Text */
p{
    font-size:clamp(16px, 4vw, 20px);
    line-height:1.8;
    margin:15px 0;
}

.highlight{
    color:#7da291;
    font-weight:bold;
}  

/* Sections */
.section{
    margin-bottom:35px;
}

/* Bilder */
img{
    width:100%;
    height:auto;
    border:2px solid #7da291;
    border-radius:10px;
    margin-top:15px;
    display:block;
}

/* Mobile */
@media (max-width:480px){
    body{ padding:15px; }
}

</style>
</head>

<body>

<div class="container">

    <h1>OUR NEXT TRIP</h1>
    <h2>ir möchten euch zu einem gemeinsamen Wochenende in <span class="highlight">Zandvoort</span> in den Niederlanden einladen!</h2>

        
        <img src="zandvoort-map.png" alt="Zandvoort Karte">

        <p>
        <span class="highlight">Vier</span> Menschen.
        </p>

         <p>
        <span class="highlight">Ein</span> Wochenende.
        </p>

         <p>
        Ein neues <span class="highlight">Abenteuer.</span>
        </p>

        <div class="section">
        
        <img src="bild1.jpg" alt="Hochzeitsbild">

    </div>

    <div class="section">

        <p>
        Wann genau? Das suchen wir gemeinsam aus.
        </p>

        <p>
        Hauptsache wir sind wieder <span class="highlight">zusammen</span> unterwegs
        </p>

        <p>
        Eure <span class="highlight">Alisa</span> & Euer <span class="highlight">Philipp</span>
        <p>

    </div>

</div>

<!-- KONFETTI LIBRARY-->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
function launchConfetti(){

    const duration = 4000; // länger
    const end = Date.now() + duration;

    const goldColors = [
        "#7da291",
        "#6f9382",
        "#8eafa1",
        "#a5beb1"
    ];

    (function frame(){

        confetti({
            particleCount: 3,          // weniger = ruhiger
            spread: 60,                // enger = eleganter
            startVelocity: 20,        // langsamer
            ticks: 200,               // längere Lebensdauer
            gravity: 0.6,             // etwas langsameres Fallen
            colors: confettiColors,
            origin: {
                x: Math.random(),
                y: 0
            }
        });

        if(Date.now() < end){
            requestAnimationFrame(frame);
        }

    })();

}

// Start beim Laden
window.onload = launchConfetti;
</script>

</body>
</html>
