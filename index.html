<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zugang gesperrt</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.panel{
    width:100%;
    max-width:420px;
    border:2px solid gold;
    padding:40px;
    text-align:center;
}

h1{
    color:gold;
    margin-bottom:20px;
    font-size:26px;
}

p{
    line-height:1.8;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:15px;
    font-size:20px;
    text-align:center;
    border:1px solid gold;
    background:#000;
    color:#fff;
}

button{
    margin-top:15px;
    width:100%;
    padding:15px;
    border:1px solid gold;
    background:transparent;
    color:gold;
    cursor:pointer;
}

button:hover{
    background:gold;
    color:black;
}

#error{
    margin-top:15px;
    color:#ff6666;
}

</style>
</head>

<body>

<div class="panel">

    <h1>ZUGANG GESPERRT</h1>

    <p>
    Vier Zahlen gewähren euch Zugang.<br><br>

    Die Zahlen findet ihr im Buch,<br>
    jede Zahl steht für die Anzahl der gefundenen Symbole in den Bildern.<br><br>

    Die Reihenfolge der Zahlen findet ihr ebenfalls im Buch.
    </p>

    <input type="password" id="code" placeholder="CODE">

    <button onclick="unlock()">PRÜFEN</button>

    <div id="error"></div>

</div>

<script>
function unlock(){

    const correctCode = "4281";

    const input = document.getElementById("code").value;
    const error = document.getElementById("error");

    if(input === correctCode){
        window.location.href = "secret.html";
    } else {
        error.innerHTML = "FALSCHER CODE";
        navigator.vibrate?.(100);
    }
}
</script>

</body>
</html>
