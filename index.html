<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zugang gesperrt</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:Montserrat, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.panel{
    width:100%;
    max-width:420px;
    border:2px solid #7da291;
    padding:40px;
    text-align:center;
}

h1{
    color:#7da291;
    margin-bottom:20px;
    font-size:26px;
}

p{
    line-height:1.8;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:15px;
    font-size:20px;
    text-align:center;
    border:1px solid #7da291;
    background:#000;
    color:#fff;
}

button{
    margin-top:15px;
    width:100%;
    padding:15px;
    border:1px solid #7da291;
    background:transparent;
    color:#f0ece7;
    cursor:pointer;
}

button:hover{
    background:#77da291;
    color:#f0ece7;
}

#error{
    margin-top:15px;
    color:#ff6666;
}

</style>
</head>

<body>

<div class="panel">

    <h1>ZUGANG GESPERRT</h1>

    <p>
    Fünf Buchstaben gewähren euch Zugang.<br><br>

    Für die Lösung müsst ihr Fragen beantworten,<br>
    die Fragen findet ihr auf der Karte im Geschenk.<br><br>
        
    </p>

    <input 
        type="text" 
        id="code" 
        placeholder="ABCDE"
        maxlength="5"
        autocomplete="off"
        autocapitalize="characters">

    <button onclick="unlock()">PRÜFEN</button>

    <div id="error"></div>

</div>

<script>
function unlock(){

    const correctCode = "ABCDE";

    const input = document
        .getElementById("code")
        .value
        .value
        .toUpperCase()
        .trim();
    const error = document.getElementById("error");

    if(input === correctCode){
        window.location.href = "secret.html";
    } else {
        error.innerHTML = "FALSCHER CODE";
        navigator.vibrate?.(100);
    }
}
</script>

</body>
</html>
