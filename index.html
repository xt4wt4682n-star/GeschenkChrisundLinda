<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zugang gesperrt</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f8f5ed;
    color:#333333;
    font-family:'Montserrat', sans-serif;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.panel{
    width:100%;
    max-width:500px;

    background:#ffffff;

    border:2px solid #7da291;

    padding:45px 35px;

    text-align:center;

    box-shadow:0 10px 35px rgba(125,162,145,0.20);

    border-radius:4px;
}

h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;

    color:#7da291;

    font-size:clamp(34px, 9vw, 52px);

    line-height:1.1;

    margin-bottom:30px;
}

.riddle{
    font-size:clamp(15px, 4vw, 18px);

    line-height:1.8;

    color:#333333;

    margin-bottom:30px;
}

input{
    width:100%;

    padding:15px;

    background:#f8f5ed;

    border:1px solid #7da291;

    color:#333333;

    font-family:'Montserrat', sans-serif;

    font-size:22px;

    font-weight:500;

    text-align:center;

    letter-spacing:7px;

    outline:none;

    border-radius:3px;

    transition:0.3s;
}

input:focus{
    border-color:#7da291;

    box-shadow:0 0 0 3px rgba(125,162,145,0.15);
}

button{
    width:100%;

    margin-top:18px;

    padding:15px;

    background:#7da291;

    border:2px solid #7da291;

    color:#ffffff;

    cursor:pointer;

    font-family:'Montserrat', sans-serif;

    font-size:15px;

    font-weight:600;

    letter-spacing:1px;

    border-radius:3px;

    transition:0.3s;
}

button:hover{
    background:#6f9382;
    border-color:#6f9382;
}

button:active{
    transform:scale(0.98);
}

#error{
    margin-top:18px;

    min-height:22px;

    color:#b85c5c;

    font-size:14px;

    font-weight:500;
}

@media (max-width:480px){

    body{
        padding:15px;
    }

    .panel{
        padding:35px 22px;
    }

    .riddle{
        font-size:15px;
    }

}

</style>
</head>

<body>

<div class="panel">

    <h1>Zugang gesperrt</h1>

    <div class="riddle">

        Fünf Zahlen gewähren euch Zugang.<br><br>

        Die Zahlen findet ihr,wenn ihr<br>
        die Fragen auf der Karte beantwortet.<br>

        Gebt die Zahlen in der<br>
        richtigen Reihenfolge ein<br>
        und löst das Rätsel.<br>

    </div>

    <input
        type="text"
        id="code"
        placeholder="•••••"
        maxlength="5"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="off">

    <button onclick="unlock()">
        PRÜFEN
    </button>

    <div id="error"></div>

</div>

<script>

/* ==========================================
   HIER DEINEN FÜNFSTELLIGEN CODE EINTRAGEN
   ========================================== */

const correctCode = "12345";


/* ==========================================
   CODE PRÜFEN
   ========================================== */

function unlock(){

    const inputField = document.getElementById("code");
    const error = document.getElementById("error");

    const enteredCode = inputField.value.trim();

    if(enteredCode === correctCode){

        /* Richtiger Code */

        window.location.href = "secret.html";

    }else{

        /* Falscher Code */

        error.textContent = "FALSCHER CODE";

        inputField.value = "";

        inputField.focus();

    }
}


/* ENTER-TASTE */

document.getElementById("code").addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            unlock();
        }

    }
);

</script>

</body>
</html>
